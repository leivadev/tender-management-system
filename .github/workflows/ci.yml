name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Configure environment
        run: |
          supabase status -o env > supabase.env
          set -a && source supabase.env && set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "RESEND_API_KEY=re_test_key"
            echo "MAIL_FROM=onboarding@resend.dev"
            echo "APP_BASE_URL=http://localhost:8787"
          } > .dev.vars
          echo "DATABASE_URL=$DB_URL" > .env

      - name: Migrate and seed admin
        run: |
          set -a && source .dev.vars && source .env && set +a
          npm run db:migrate
          psql "$DATABASE_URL" -f drizzle/manual/profiles_auth_fk.sql
          node scripts/create-admin.mjs admin@example.com "AdminPass123!"

      - run: npm run test
